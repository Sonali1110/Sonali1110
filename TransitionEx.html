<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        .d1
        {
            height: 100px;
            width: 100px;
            background-color: red;
            transition: height 2s, width 6s, background-color 10s;

        {
            height: 400px;
            width: 400px;
            background-color:darkslateblue;
        }
    </style>
